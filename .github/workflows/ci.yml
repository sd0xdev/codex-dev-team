name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is unavailable on Ubuntu 26.04 and macOS arm64.
          - os: ubuntu-24.04
            python: '3.9'
          - os: macos-15-intel
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/codex-dev-team/scripts -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills" --dry-run
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills"
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills"
