name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/codex-dev-team/scripts -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills" --dry-run
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills"
      - run: python install.py --target "$RUNNER_TEMP/dev-team-install/skills"
